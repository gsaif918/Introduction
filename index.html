<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction</title>
    <style>
        :root {
            --bg-color: #000;
            --text: #fff;
            --python-yellow: #FFD43B;
            --hacker-green: #00FF41;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh; width: 100vw;
        }

        #master-container {
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
            height: 300vh; width: 100%;
        }

        .screen { 
            height: 100vh; width: 100%; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start;
            padding-top: 8vh; box-sizing: border-box;
            position: relative;
        }

        /* Matrix Canvas - Sirf Screen 3 ke liye */
        #matrix-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; opacity: 0.35;
        }

        .screen-content { position: relative; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center; }

        /* --- SCREEN 1: PROFILE SIDE-BY-SIDE --- */
        .content-limit { width: 95%; max-width: 400px; text-align: left; }
        
        .top-bar { 
            font-weight: 700; font-size: 1.2rem; 
            margin-bottom: 20px; letter-spacing: 0.5px; 
            display: block; width: 100%; text-align: left;
        }

        .profile-header {
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            width: 100%;
            margin-bottom: 15px;
        }

        .profile-pic-ring { 
            width: 90px; height: 90px; 
            border-radius: 50%; padding: 3px; 
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); 
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .profile-pic { width: 94%; height: 94%; background-color: #111; border-radius: 50%; overflow: hidden; border: 2px solid #000; }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }

        .stats-container {
            display: flex; 
            justify-content: space-around; 
            flex-grow: 1; 
            margin-left: 15px;
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-weight: bold; font-size: 1.1rem; }
        .stat-label { font-size: 0.7rem; color: #a8a8a8; text-transform: capitalize; }

        .bio-section { 
            font-size: 0.9rem; line-height: 1.4; 
            text-align: left; width: 100%; 
            margin-top: 5px; border: none;
            white-space: pre-wrap; 
        }

        /* --- TEXT SCREENS --- */
        .text-screen { padding: 12% 10%; align-items: flex-start; text-align: left; }
        .type-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; color: var(--python-yellow); min-height: 1.2em; }
        .type-desc { font-size: 1.1rem; color: #eee; line-height: 1.5; min-height: 5em; }

        .follow-btn {
            margin-top: 25px; background-color: var(--hacker-green);
            color: #000; padding: 16px 45px; border-radius: 12px;
            font-weight: 900; font-size: 1rem; border: none;
            cursor: pointer; display: none; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }
    </style>
</head>
<body>

<div id="master-container">
    <!-- SCREEN 1 -->
    <div class="screen">
        <div class="content-limit">
            <span class="top-bar" id="display-username">SYNCING...</span>
            <div class="profile-header">
                <div class="profile-pic-ring">
                    <div class="profile-pic"><img id="display-pfp" src=""></div>
                </div>
                <div class="stats-container">
                    <div class="stat-item"><span class="stat-val" id="posts">0</span><span class="stat-label">Posts</span></div>
                    <div class="stat-item"><span class="stat-val" id="followers">0</span><span class="stat-label">Followers</span></div>
                    <div class="stat-item"><span class="stat-val" id="following">0</span><span class="stat-label">Following</span></div>
                </div>
            </div>
            <div class="bio-section" id="display-bio">Loading data...</div>
        </div>
    </div>

    <!-- SCREEN 2 -->
    <div class="screen text-screen">
        <div id="type-title-2" class="type-title"></div>
        <div id="type-desc-2" class="type-desc"></div>
    </div>

    <!-- SCREEN 3 -->
    <div class="screen text-screen">
        <canvas id="matrix-canvas"></canvas>
        <div class="screen-content">
            <div id="type-title-3" class="type-title"></div>
            <div id="type-desc-3" class="type-desc"></div>
            <button class="follow-btn" id="follow-trigger">FOLLOW</button>
        </div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgk9L2oBNQWT7ajQ1ndllegly4_W5cNeEid4CCfVR4mMrImdy2DYeXaqqCoOrARia0ia3-A5nwJcj1/pub?gid=1993999992&single=true&output=csv';
    let fetchedUsername = "";

    function formatK(num) { return num >= 1000 ? (num / 1000).toFixed(1) + 'k' : num; }

    async function typeWriter(text, elementId, speed = 40) {
        let i = 0;
        const element = document.getElementById(elementId);
        return new Promise(resolve => {
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i); i++;
                    setTimeout(type, speed);
                } else { resolve(); }
            }
            type();
        });
    }

    async function startFlow() {
        setTimeout(async () => {
            document.getElementById('master-container').style.transform = 'translateY(-100vh)';
            await typeWriter(`Hey, I'm python developer`, "type-title-2", 50);
            await typeWriter(`Join my community of Python developers. Master automation, logic, and coding patterns with me.`, "type-desc-2", 30);
            
            setTimeout(async () => {
                document.getElementById('master-container').style.transform = 'translateY(-200vh)';
                initMatrix();
                await typeWriter(`Become a Pro`, "type-title-3", 50);
                await typeWriter(`The journey to professional Python development starts here. Tap follow to stay updated!`, "type-desc-3", 30);
                document.getElementById('follow-trigger').style.display = "block";
            }, 3000);
        }, 4000);
    }

    async function fetchData() {
        try {
            const res = await fetch(sheetURL);
            const csv = await res.text();
            const rows = csv.split('\n').map(r => r.split(','));
            if (rows.length > 1) {
                const d = rows[1];
                fetchedUsername = d[3].trim();
                document.getElementById('display-username').innerText = fetchedUsername;
                document.getElementById('display-bio').innerText = d[5].trim().replace(/;/g, '\n');
                
                // Image ID Logic
                let id = d[6].trim();
                if(id.includes('/d/')) id = id.split('/d/')[1].split('/')[0];
                document.getElementById('display-pfp').src = `https://lh3.googleusercontent.com/u/0/d/${id}`;

                document.getElementById('posts').innerText = d[0].trim();
                let fCount = parseInt(d[1].trim());
                document.getElementById('followers').innerText = formatK(fCount);
                document.getElementById('following').innerText = d[2].trim();
                
                startFlow();
            }
        } catch (e) { console.error("Sync Error"); }
    }

    function initMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01"; const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF41"; ctx.font = fontSize + "px monospace";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
    }

    document.getElementById('follow-trigger').onclick = () => {
        window.open(`https://instagram.com/${fetchedUsername}`, '_blank');
    };

    window.onload = fetchData;
</script>
</body>
</html>
